<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="box">

<h2>Register</h2>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<select name="role">

<option value="user">User</option>

<option value="admin">Admin</option>

</select>

<button type="submit">

Register

</button>

</form>

<p>

Already Registered?

<a href="/login">

Login

</a>

</p>

</div>

</body>
</html>
